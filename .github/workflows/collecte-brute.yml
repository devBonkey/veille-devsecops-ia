name: Veille DevSecOps - Collecte brute (sans IA)

on:
  schedule:
    - cron: '0 2,6,10,14,18,22 * * *'
  workflow_dispatch: {}

concurrency:
  group: veille-collecte-brute
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  collecte-brute:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - groupe_id: secu
            mots_cles: "SecOps,Cloud Security Engineer,Ingénieur SecOps,Architecte Sécurité Cloud,Consultant Sécurité Cloud,Analyste SOC"
          - groupe_id: cloud-devops
            mots_cles: "DevSecOps,DevOps,Cloud Builder,Ingénieur Cloud,Ingénieur DevOps"
          - groupe_id: infra-sre
            mots_cles: "Site Reliability Engineer (SRE),Ingénieur Système et Réseau,Ingénieur de Production IT et Release Engineer,Administrateur Systèmes,Administrateur Systèmes et Réseaux"
          - groupe_id: dev
            mots_cles: "Développeur Web,Développeur Fullstack,Développeur Mobile Flutter,Développeur Mobile,Développeur Logiciel"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Installer les dépendances Python
        run: pip install -r requirements.txt

      - name: Lire la version de Playwright installée
        id: playwright
        run: |
          version=$(python -c "from importlib.metadata import version; print(version('playwright'))") || { echo "::error::Impossible de lire la version de Playwright installée"; exit 1; }
          echo "Playwright version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restaurer le cache Chromium (Playwright)
        id: cache-chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Télécharger Chromium (si absent du cache)
        if: steps.cache-chromium.outputs.cache-hit != 'true'
        run: playwright install chromium

      - name: Installer les dépendances système de Chromium
        run: playwright install-deps chromium

      - name: Lire (sans réécrire) l'historique anti-doublons du run IA
        uses: actions/cache/restore@v4
        with:
          path: historique_offres_${{ matrix.groupe_id }}.json
          key: v2-etat-veille-${{ matrix.groupe_id }}-${{ github.run_id }}
          restore-keys: |
            v2-etat-veille-${{ matrix.groupe_id }}-

      - name: Restaurer le fichier des offres brutes (propre à ce workflow)
        uses: actions/cache/restore@v4
        with:
          path: offres_brutes_${{ matrix.groupe_id }}.xlsx
          key: v2-collecte-brute-${{ matrix.groupe_id }}-${{ github.run_id }}
          restore-keys: |
            v2-collecte-brute-${{ matrix.groupe_id }}-

      - name: Lancer la collecte sans IA
        run: python veille_collecte_rapide.py
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          LBA_API_KEY: ${{ secrets.LBA_API_KEY }}
          GROUPE_ID: ${{ matrix.groupe_id }}
          MOTS_CLES_GROUPE: ${{ matrix.mots_cles }}

      - name: Sauvegarder le fichier des offres brutes pour le prochain passage
        if: always()
        uses: actions/cache/save@v4
        with:
          path: offres_brutes_${{ matrix.groupe_id }}.xlsx
          key: v2-collecte-brute-${{ matrix.groupe_id }}-${{ github.run_id }}

      - name: Uploader l'Excel du groupe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collecte-brute-${{ matrix.groupe_id }}-${{ github.run_id }}
          path: |
            offres_brutes_${{ matrix.groupe_id }}.xlsx
          retention-days: 7
          if-no-files-found: warn
